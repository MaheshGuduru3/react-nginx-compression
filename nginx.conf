worker_processes auto;

events {
    worker_connections 1024;
}

http {

    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    sendfile on;

    # =============================
    # GZIP
    # =============================

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;


    # =============================
    # BROTLI
    # =============================

    brotli on;
    brotli_comp_level 6;
    brotli_min_length 1024;

    brotli_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;


    # =============================
    # SERVER
    # =============================

    server {

        listen 80;

        server_name localhost;

        root /var/www/html;

        index index.html;


        location / {

            try_files $uri $uri/ /index.html;
        }


        # =============================
        # STATIC ASSETS CACHE
        # =============================

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {

            expires 1y;

            add_header Cache-Control "public, immutable";
        }
    }
}